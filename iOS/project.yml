name: Laundrly
options:
  bundleIdPrefix: com.shimondeitel.laundrylog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Laundrly:
    type: application
    platform: iOS
    sources:
      - path: Laundrly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.laundrylog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Laundrly/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  LaundrlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LaundrlyTests
      - path: Laundrly.storekit
    dependencies:
      - target: Laundrly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.laundrylog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  LaundrlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LaundrlyUITests
    dependencies:
      - target: Laundrly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.laundrylog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Laundrly:
    build:
      targets:
        Laundrly: all
        LaundrlyTests: [test]
        LaundrlyUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Laundrly.storekit
    test:
      config: Debug
      storeKitConfiguration: Laundrly.storekit
      targets:
        - LaundrlyTests
        - LaundrlyUITests
    archive:
      config: Release
